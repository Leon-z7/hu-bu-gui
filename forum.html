<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>交流分享 - 胡不归</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">胡不归</a>
      <nav>
        <a href="regions.html">地区选择</a>
        <a href="livelihood.html">谋生之道</a>
        <a class="active" href="forum.html">交流分享</a>
      </nav>
    </header>

    <main class="page forum-page">
      <section class="page-head">
        <p>把真实经验留下来，后来的人会少走一点弯路</p>
        <h1>交流分享</h1>
      </section>

      <section class="post-composer" aria-label="发布分享">
        <input type="text" placeholder="标题，例如：我在海边县城住了 60 天">
        <textarea placeholder="写下地区、开销、谋生方式、踩坑提醒或心情记录"></textarea>
        <button type="button">发布分享</button>
      </section>

      <section class="posts" aria-label="论坛帖子">
        <article class="post">
          <p class="post__meta">小盐 · 海边县城 · 今天</p>
          <h2>淡季月租 900，真正贵的是来回交通</h2>
          <p>住下来以后发现，菜价和房租都还好，但如果每周进城一次，交通会把预算抬高不少。</p>
        </article>
        <article class="post">
          <p class="post__meta">林下客 · 山地小城 · 昨天</p>
          <h2>冬天之前一定要确认取暖方式</h2>
          <p>夏天看房很容易被风景打动，冬天才知道电费、保温和热水有多重要。</p>
        </article>
      </section>
    </main>
  </body>
</html>
