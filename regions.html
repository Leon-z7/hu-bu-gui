<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>地区选择 - 胡不归</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">胡不归</a>
      <nav>
        <a class="active" href="regions.html">地区选择</a>
        <a href="livelihood.html">谋生之道</a>
        <a href="forum.html">交流分享</a>
      </nav>
    </header>

    <main class="page">
      <section class="page-head">
        <p>先选一片能让身体松下来的土地</p>
        <h1>地区选择</h1>
      </section>

      <section class="region-grid" aria-label="地区攻略">
        <article class="info-card">
          <span>山地小城</span>
          <h2>低租金，慢节奏</h2>
          <p>适合预算有限、愿意接受交通不那么密集的人。重点比较房租、冬季取暖、医院距离和快递便利度。</p>
        </article>
        <article class="info-card">
          <span>海边县城</span>
          <h2>空气好，淡旺季明显</h2>
          <p>适合喜欢户外和散步的人。淡季生活成本低，旺季人流多，短租和小生意机会也更多。</p>
        </article>
        <article class="info-card">
          <span>城郊村镇</span>
          <h2>离城市近，生活弹性大</h2>
          <p>适合还需要偶尔进城工作、看病或社交的人。优先看公共交通、菜市场和网络稳定性。</p>
        </article>
      </section>
    </main>
  </body>
</html>
